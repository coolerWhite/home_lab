services:
  nginx:
    image: nginx
    container_name: nginx-proxy
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: '1'
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
      - ./www:/var/www/html
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - default_net
    
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "sleep 10 && 
              certbot certonly --webroot 
              --webroot-path=/var/www/certbot 
              --email goodbey_08@yahoo.com 
              --agree-tos 
              --no-eff-email 
              -d whiteninja.su"
    networks:
      - default_net

networks:
  default_net:
    external: true